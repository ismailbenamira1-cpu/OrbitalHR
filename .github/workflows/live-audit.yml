name: Public deployment audit
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *' # Daily UTC, read-only probes only; GitHub scheduled runs are best effort
permissions:
  contents: read
jobs:
  live-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public Cloudflare deployment (read-only)
        run: node tests/live-deployment-audit.mjs
